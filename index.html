<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search,arrow_back_ios_new,arrow_forward_ios,close,play_arrow" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="home-page">

    <main class="main-container">

        <div class="navigation-bar">
            <div class="browse-elements">
                <a href="index.html">
                    <img class="netflix-logo" src="assets/netlix-logo.jpg">
                </a>
                <a href="index.html" class="browse-button">Home</a>
                <a href="browse.html?type=movie" class="browse-button">Movies</a>
                <a href="browse.html?type=series" class="browse-button">Series</a>
                <a href="index.html" class="browse-button">My List</a>
            </div>

            <div class="misc-elements">
                <div class="search-container">
                    <button class="misc-button">
                        <span class="material-symbols-outlined">
                            search
                        </span>
                    </button>
                    <input class="search-bar" type="text" placeholder="Titles, people, genres">
                    <div class="search-suggestions">
                        <div class="searched-title"></div>
                    </div>
                    
                </div>
                <button class="misc-button">KIDS</button>
                <button class="misc-button">Profile</button>
            </div>
        </div>

        <div class="categories-container"></div>

        <div class="modal-overlay">
            <div class="movie-modal">
                <button class="close-modal">
                    <span class="material-symbols-outlined">
                        close
                    </span>
                </button>
                <div class="image-container">
                    <img class="modal-image" src="" alt="">
                </div>
                <div class="modal-content">
                    <h2 class="modal-title"></h2>

                    <div class="movie-info">
                        <div class="movie-year"></div>
                        <div class="movie-genre"></div>
                        <div class="movie-rating"></div>
                        <div class="movie-cast"></div>
                    </div>

                    <p class="modal-description"></p>

                    <button class="play-button">
                        <span class="material-symbols-outlined">
                            play_arrow
                        </span>
                    </button>
                    <div class="episodes-container">
                        <div class="episodes-header">
                            <h3 class="episodes-title">Episodes</h3>
                            <select class="season-select"></select>
                        </div>
                        <div class="episodes-list"></div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="main.js"></script>
    
</body>
</html>
