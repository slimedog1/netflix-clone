<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=search,arrow_back_ios_new,arrow_forward_ios,close,play_arrow" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="main-container">

        <div class="navigation-bar">
            <div class="browse-elements">
                <a href="index.html">
                    <img class="netflix-logo" src="assets/netlix-logo.jpg">
                </a>
                <button class="browse-button">Home</button>
                <button class="browse-button">Movies</button>
                <button class="browse-button">Series</button>
                <button class="browse-button">My List</button>
            </div>

            <div class="misc-elements">
                <button class="misc-button">
                    <span class="material-symbols-outlined">
                        search
                    </span>
                </button>
                <button class="misc-button">KIDS</button>
                <button class="misc-button">Profile</button>
            </div>
        </div>

        <div class="category"> 
            <h3 class="category-title">Trending Now</h3>
            <div class="movie-container">
                <button class="left-button">
                    <span class="material-symbols-outlined">
                        arrow_back_ios_new
                    </span>
                </button>
                    <div class="movie-row">
                        
                    </div>
                <button class="right-button">
                    <span class="material-symbols-outlined">
                        arrow_forward_ios
                    </span>
                </button>
            </div>
        </div>

        <div class="modal-overlay">
            <div class="movie-modal">
                <button class="close-modal">
                    <span class="material-symbols-outlined">
                        close
                    </span>
                </button>
                <div class="image-container">
                    <img class="modal-image" src="" alt="">
                </div>
                <div class="modal-content">
                    <h3 class="modal-title"></h3>

                    <div class="movie-info">
                        <div class="movie-year"></div>
                        <div class="movie-genre"></div>
                        <div class="movie-rating"></div>
                    </div>

                    <p class="modal-description"></p>

                    <button class="play-button">
                        <span class="material-symbols-outlined">
                            play_arrow
                        </span>
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script src="movieRow.js"></script>
    
</body>
</html>
